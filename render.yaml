services:
  - type: web
    name: sih-astra-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
    # Free tier: spins down after 15 min of inactivity, wakes on first request.
    # Upgrade to a paid plan to keep it always-on.
